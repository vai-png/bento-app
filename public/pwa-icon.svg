<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bentoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141824"/>
      <stop offset="100%" stop-color="#07090E"/>
    </linearGradient>
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F8E"/>
      <stop offset="100%" stop-color="#E11D48"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bentoBg)"/>
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="rgba(244, 63, 142, 0.25)" stroke-width="4"/>
  
  <!-- Glowing Macro Arc Ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#1A1F2C" stroke-width="26"/>
  <path d="M 256 96 A 160 160 0 0 1 408 208" fill="none" stroke="url(#pinkGrad)" stroke-width="26" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M 408 240 A 160 160 0 0 1 369 369" fill="none" stroke="#8B5CF6" stroke-width="26" stroke-linecap="round"/>
  <path d="M 336 395 A 160 160 0 0 1 200 411" fill="none" stroke="#F59E0B" stroke-width="26" stroke-linecap="round"/>
  <path d="M 160 395 A 160 160 0 0 1 96 256" fill="none" stroke="#FB7185" stroke-width="26" stroke-linecap="round"/>

  <!-- Center Bento Monogram 'B' -->
  <text x="256" y="325" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="190" font-weight="900" fill="#F8FAFC" text-anchor="middle" letter-spacing="-6">B</text>
  <circle cx="350" cy="180" r="18" fill="#F43F8E" filter="url(#glow)"/>
</svg>
